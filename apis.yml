description: asgoodasnew is a German e-commerce retailer of refurbished and pre-owned consumer electronics,
  including smartphones, tablets, laptops, cameras, and related accessories, sold with warranty through its
  online store at asgoodasnew.de (asgoodasnew.com redirects there). It was surfaced as a portfolio company
  of Point Nine and added to the API Evangelist network as a lead. Probing the public surface found no
  developer portal, API documentation, or API host — this is a consumer-facing storefront with no public
  API program at this time. The profile is retained as a portfolio lead; only mechanical domain-security
  signals for the web host could be captured.
